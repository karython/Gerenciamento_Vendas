<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Vendas</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{% static 'js/loader.js' %}"></script>
    <style>
        .password-container {
            position: relative;
            width: 100%;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.3s;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: #333;
        }
        
        .cadastro-form-group .password-container input {
            padding-right: 45px;
        }
        
        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }
        
        .strength-bar {
            height: 4px;
            width: 100%;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .strength-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }
        
        .strength-weak { background-color: #dc3545; width: 33%; }
        .strength-medium { background-color: #ffc107; width: 66%; }
        .strength-strong { background-color: #28a745; width: 100%; }
    </style>
</head>
<body class="cadastro-body">
    <div class="cadastro-container">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <h1>Criar Conta</h1>
                <p>Cadastre sua loja e comece a vender</p>
            </div>

            <div class="cadastro-form-container">
                {% if messages %}
                <div class="cadastro-messages">
                    {% for message in messages %}
                    <div class="cadastro-alert cadastro-alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST" id="form-cadastro">
                    {% csrf_token %}

                    <div class="cadastro-form-group">
                        <label>Nome da Loja <span class="cadastro-required">*</span></label>
                        <input type="text" 
                               name="nome" 
                               required 
                               maxlength="200"
                               value="{{ dados.nome|default:'' }}"
                               placeholder="Ex: Loja do João">
                    </div>

                    <div class="cadastro-form-group">
                        <label>CNPJ <span class="cadastro-required">*</span></label>
                        <input type="text" 
                               name="cnpj" 
                               id="cnpj"
                               required 
                               maxlength="18"
                               value="{{ dados.cnpj|default:'' }}"
                               placeholder="00.000.000/0000-00">
                        <small>Digite apenas números ou use o formato com pontuação</small>
                    </div>

                    <div class="cadastro-form-group">
                        <label>Telefone</label>
                        <input type="text" 
                               name="telefone" 
                               id="telefone"
                               maxlength="15"
                               value="{{ dados.telefone|default:'' }}"
                               placeholder="(00) 00000-0000">
                    </div>

                    <div class="cadastro-form-group">
                        <label>E-mail</label>
                        <input type="email" 
                               name="email"
                               maxlength="120"
                               value="{{ dados.email|default:'' }}"
                               placeholder="contato@loja.com">
                    </div>

                    <div class="cadastro-form-group">
                        <label>Endereço</label>
                        <input type="text" 
                               name="endereco"
                               maxlength="255"
                               value="{{ dados.endereco|default:'' }}"
                               placeholder="Rua, número, bairro, cidade">
                    </div>

                    <div class="cadastro-form-group">
                        <label>Senha <span class="cadastro-required">*</span></label>
                        <div class="password-container">
                            <input type="password" 
                                   name="senha" 
                                   id="senha"
                                   required 
                                   minlength="6"
                                   maxlength="50"
                                   placeholder="Mínimo 6 caracteres"
                                   oninput="checkPasswordStrength()">
                            <i class="fas fa-eye password-toggle" 
                               id="toggle-senha"
                               onclick="togglePassword('senha', 'toggle-senha')"
                               title="Mostrar senha"></i>
                        </div>
                        <div class="password-strength" id="password-strength" style="display: none;">
                            <div class="strength-bar">
                                <div class="strength-bar-fill" id="strength-bar-fill"></div>
                            </div>
                            <small id="strength-text"></small>
                        </div>
                        <small>A senha deve ter no mínimo 6 caracteres</small>
                    </div>

                    <div class="cadastro-form-group">
                        <label>Confirmar Senha <span class="cadastro-required">*</span></label>
                        <div class="password-container">
                            <input type="password" 
                                   name="senha_confirmacao" 
                                   id="senha_confirmacao"
                                   required 
                                   minlength="6"
                                   maxlength="50"
                                   placeholder="Digite a senha novamente"
                                   oninput="checkPasswordMatch()">
                            <i class="fas fa-eye password-toggle" 
                               id="toggle-senha-confirmacao"
                               onclick="togglePassword('senha_confirmacao', 'toggle-senha-confirmacao')"
                               title="Mostrar senha"></i>
                        </div>
                        <small id="password-match-message"></small>
                    </div>

                    <button type="submit" class="cadastro-btn cadastro-btn-primary">
                        Criar Conta
                    </button>

                    <div class="cadastro-divider">ou</div>

                    <a href="{% url 'login' %}" class="cadastro-btn cadastro-btn-secondary">
                        Já tenho uma conta
                    </a>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Toggle de senha (mostrar/ocultar)
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.setAttribute('title', 'Ocultar senha');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.setAttribute('title', 'Mostrar senha');
            }
        }

        // Verificar força da senha
        function checkPasswordStrength() {
            const senha = document.getElementById('senha').value;
            const strengthDiv = document.getElementById('password-strength');
            const strengthBar = document.getElementById('strength-bar-fill');
            const strengthText = document.getElementById('strength-text');
            
            if (senha.length === 0) {
                strengthDiv.style.display = 'none';
                return;
            }
            
            strengthDiv.style.display = 'block';
            
            let strength = 0;
            
            // Critérios de força
            if (senha.length >= 6) strength++;
            if (senha.length >= 10) strength++;
            if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) strength++;
            if (/\d/.test(senha)) strength++;
            if (/[^a-zA-Z0-9]/.test(senha)) strength++;
            
            // Atualizar barra
            strengthBar.className = 'strength-bar-fill';
            
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Fraca';
                strengthText.style.color = '#dc3545';
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = 'Média';
                strengthText.style.color = '#ffc107';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Forte';
                strengthText.style.color = '#28a745';
            }
            
            // Verificar match quando há confirmação
            checkPasswordMatch();
        }

        // Verificar se as senhas coincidem
        function checkPasswordMatch() {
            const senha = document.getElementById('senha').value;
            const confirmacao = document.getElementById('senha_confirmacao').value;
            const message = document.getElementById('password-match-message');
            
            if (confirmacao.length === 0) {
                message.textContent = '';
                return;
            }
            
            if (senha === confirmacao) {
                message.textContent = '✓ As senhas coincidem';
                message.style.color = '#28a745';
            } else {
                message.textContent = '✗ As senhas não coincidem';
                message.style.color = '#dc3545';
            }
        }

        // Máscara para CNPJ
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 14) {
                value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            
            e.target.value = value;
        });

        // Máscara para telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 11) {
                if (value.length <= 10) {
                    value = value.replace(/^(\d{2})(\d)/, '($1) $2');
                    value = value.replace(/(\d{4})(\d)/, '$1-$2');
                } else {
                    value = value.replace(/^(\d{2})(\d)/, '($1) $2');
                    value = value.replace(/(\d{5})(\d)/, '$1-$2');
                }
            }
            
            e.target.value = value;
        });

        // Validação de senha e loader
        document.getElementById('form-cadastro').addEventListener('submit', function(e) {
            const senha = document.querySelector('input[name="senha"]').value;
            const confirmacao = document.querySelector('input[name="senha_confirmacao"]').value;

            if (senha !== confirmacao) {
                e.preventDefault();
                alert('❌ As senhas não coincidem!');
                return;
            }

            if (senha.length < 6) {
                e.preventDefault();
                alert('❌ A senha deve ter no mínimo 6 caracteres!');
                return;
            }

            // Mostrar loader ao submeter
            mostrarLoader('Criando sua conta...');
        });
    </script>
</body>
</html>

{% extends 'core/base.html' %}
{% load static %}

{% block title %}Editar Cliente{% endblock %}

{% block dashboard_content %}
<div class="header">
    <h1>Editar Cliente</h1>
</div>

<div class="card">
    <form id="form-editar-cliente" method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label for="cli-nome">Nome Completo *</label>
                <input type="text" id="cli-nome" name="nome" class="form-control" value="{{ cliente.nome }}" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="cli-nasc">Data de Nascimento</label>
                <input type="date" id="cli-nasc" name="data_nascimento" class="form-control" value="{{ cliente.data_nascimento|date:'Y-m-d' }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="cli-doc">CPF / CNPJ *</label>
                <input type="text" id="cli-doc" name="cpf" class="form-control" value="{{ cliente.cpf }}" required>
            </div>
            <div class="form-group">
                <label for="cli-tel">Telefone *</label>
                <input type="tel" id="cli-tel" name="telefone" class="form-control" value="{{ cliente.telefone }}" required>
            </div>
        </div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--cor-borda);">

        <div class="form-group">
            <label for="cli-endereco">Endereço</label>
            <input type="text" id="cli-endereco" name="logradouro" class="form-control"
                   value="{{ endereco.logradouro|default:'' }}" placeholder="Rua, Número, Bairro...">
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label for="cli-cidade">Cidade</label>
                <input type="text" id="cli-cidade" name="cidade" class="form-control"
                       value="{{ endereco.cidade.nome|default:'' }}">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="cli-estado">Estado</label>
                <input type="text" id="cli-estado" name="estado" class="form-control"
                       value="{{ endereco.cidade.uf.sigla|default:'' }}" maxlength="2" placeholder="SP">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="cli-cep">CEP</label>
                <input type="text" id="cli-cep" name="cep" class="form-control"
                       value="{{ endereco.cep|default:'' }}" placeholder="00000-000">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{% url 'clientes' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<style>
.btn-secondary {
    background-color: #6c757d;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.btn-secondary:hover {
    background-color: #5a6268;
}
</style>

<script>
function aplicarMascaraDocumento(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 14);
    if (v.length <= 11) {
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    } else {
        v = v.replace(/(\d{2})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1/$2');
        v = v.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
    }
    input.value = v;
}

document.addEventListener('DOMContentLoaded', function() {
    const docInput = document.getElementById('cli-doc');
    if (docInput) {
        docInput.addEventListener('input', function() { aplicarMascaraDocumento(this); });
    }
});
</script>
{% endblock %}

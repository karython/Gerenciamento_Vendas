<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas - Home</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .home-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .home-card {
            background: var(--cor-branco);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
        }
        .home-card h1 {
            font-size: 32px;
            color: var(--color-green-dark);
            margin-bottom: 20px;
        }
        .home-card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .home-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .home-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .home-btn-primary {
            background: linear-gradient(135deg, var(--color-green-medium) 0%, var(--color-green-light) 100%);
            color: white;
        }
        .home-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-green-transparent-medium);
        }
        .home-btn-secondary {
            background: var(--color-brown-medium);
            color: white;
        }
        .home-btn-secondary:hover {
            background: var(--color-brown-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body style="background-color: var(--cor-fundo); margin: 0; padding: 0;">
    <div class="home-container">
        <div class="home-card">
            <img src="{% static 'img/logo.png' %}" alt="Logo" style="width: 120px; margin-bottom: 30px;">
            <h1>Sistema de Vendas</h1>
            <p>Gerencie seu estoque, clientes e vendas de forma rápida e eficiente.</p>
            <div class="home-buttons">
                <a href="{% url 'login' %}" class="home-btn home-btn-primary">Entrar</a>
                <a href="{% url 'cadastro' %}" class="home-btn home-btn-secondary">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/loader.js' %}"></script>
</body>
</html>

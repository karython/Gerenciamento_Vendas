<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{% static 'js/loader.js' %}"></script>
    <style>
        .password-container {
            position: relative;
            width: 100%;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.3s;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: #333;
        }
        
        .login-form-group .password-container input {
            padding-right: 45px;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'img/logo.png' %}" alt="Logo" style="width: 150px; margin-bottom: 20px;">
                <h1>Login</h1>
                <p>Acesse sua conta</p>
            </div>

            <div class="login-form-container">
                {% if messages %}
                <div class="login-messages">
                    {% for message in messages %}
                    <div class="login-alert login-alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="login-form-group">
                        <label>CNPJ</label>
                        <input type="text" 
                               name="cnpj" 
                               id="cnpj"
                               required 
                               maxlength="18"
                               value="{{ cnpj|default:'' }}"
                               placeholder="00.000.000/0000-00"
                               autofocus>
                    </div>

                    <div class="login-form-group">
                        <label>Senha</label>
                        <div class="password-container">
                            <input type="password" 
                                   name="senha" 
                                   id="senha-login"
                                   required 
                                   placeholder="Digite sua senha">
                            <i class="fas fa-eye password-toggle" 
                               id="toggle-senha-login"
                               onclick="togglePassword('senha-login', 'toggle-senha-login')"
                               title="Mostrar senha"></i>
                        </div>
                    </div>

                    <button type="submit" class="login-btn login-btn-primary">
                        Entrar
                    </button>

                    <div class="login-divider">ou</div>

                    <a href="{% url 'cadastro' %}" class="login-btn login-btn-secondary">
                        Criar uma conta
                    </a>
                </form>

                <div class="login-back-link">
                    <a href="{% url 'index' %}">← Voltar para página inicial</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle de senha (mostrar/ocultar)
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.setAttribute('title', 'Ocultar senha');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.setAttribute('title', 'Mostrar senha');
            }
        }

        // Interceptar submissão do formulário de login
        document.querySelector('form').addEventListener('submit', function(e) {
            mostrarLoader('Verificando credenciais...');
        });

        // Máscara para CNPJ
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 14) {
                value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            
            e.target.value = value;
        });

        // Permitir Enter no campo CNPJ
        document.getElementById('cnpj').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('senha-login').focus();
            }
        });
    </script>
</body>
</html>

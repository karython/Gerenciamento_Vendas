services:
  web:
    build: .
    container_name: gerenciamento_vendas_web
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      PYTHONPATH: ""
      ALLOWED_HOSTS: "tropical.karythongomes.com.br,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://tropical.karythongomes.com.br"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs:/app/logs
    networks:
      - default

networks:
  default:
    name: gerenciamento_vendas_default

volumes:
  static_files:
  media_files:
  logs:

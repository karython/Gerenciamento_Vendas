<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/loader.js' %}"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static '/img/logo.png' %}" alt="Logo" style="width: 150px; margin-bottom: 20px;">
                <h1>Login</h1>
                <p>Acesse sua conta</p>
            </div>

            <div class="login-form-container">
                {% if messages %}
                <div class="login-messages">
                    {% for message in messages %}
                    <div class="login-alert login-alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="login-form-group">
                        <label>CNPJ</label>
                        <input type="text" 
                               name="cnpj" 
                               id="cnpj"
                               required 
                               maxlength="18"
                               value="{{ cnpj|default:'' }}"
                               placeholder="00.000.000/0000-00"
                               autofocus>
                    </div>

                    <div class="login-form-group">
                        <label>Senha</label>
                        <input type="password" 
                               name="senha" 
                               required 
                               placeholder="Digite sua senha">
                    </div>

                    <button type="submit" class="login-btn login-btn-primary">
                        Entrar
                    </button>

                    <div class="login-divider">ou</div>

                    <a href="{% url 'cadastro' %}" class="login-btn login-btn-secondary">
                        Criar uma conta
                    </a>
                </form>

                <div class="login-back-link">
                    <a href="{% url 'index' %}">← Voltar para página inicial</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Interceptar submissão do formulário de login
        document.querySelector('form').addEventListener('submit', function(e) {
            mostrarLoader('Verificando credenciais...');
        });

        // Máscara para CNPJ
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 14) {
                value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            
            e.target.value = value;
        });
    </script>
</body>
</html>

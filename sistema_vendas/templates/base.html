{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Sistema{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="sidebar">
        <div class="logo">
            <img src="" alt="Logo da Empresa">
        </div>
        
        <ul class="menu">
            <li><a href="{% url 'dashboard' %}" class="{% if request.path == '/dashboard/' %}active{% endif %}">Dashboard</a></li>
            <li><a href="{% url 'estoque' %}" class="{% if request.path == '/estoque/' %}active{% endif %}">Estoque</a></li>
            <li><a href="{% url 'nova_venda' %}" class="{% if request.path == '/nova-venda/' %}active{% endif %}">Nova Venda</a></li>
            <li><a href="{% url 'vendas' %}" class="{% if request.path == '/vendas/' %}active{% endif %}">Vendas</a></li>
            <li><a href="{% url 'clientes' %}" class="{% if request.path == '/clientes/' %}active{% endif %}">Clientes</a></li>
        </ul>
        
        <div class="store-info">
            <strong>Minha Loja LTDA</strong>
            <p style="font-size: 14px; color: #555;">CNPJ: 00.000.000/0001-00</p>
        </div>
        
        <ul class="menu" style="margin-top: 20px;">
           <li><a href="{% url 'logout' %}" class="logout">Sair do Sistema</a></li>
        </ul>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
